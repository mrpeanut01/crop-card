name: visual-baselines

# Re-captures the Linux visual baselines on the same runner image + Chromium
# build CI uses, then commits the updated *-linux.png files back to the
# chosen branch. Run it after an intentional UI change, review the committed
# PNGs in the PR diff, and the `visual` CI job compares against them.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to re-capture and commit baselines on
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cropcard/web exec playwright install --with-deps chromium

      - name: Re-capture Linux baselines
        env:
          CI: "1"
          E2E_VISUAL: "1"
        run: pnpm --filter @cropcard/web exec playwright test tests/e2e/visual --update-snapshots=all

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web/tests/e2e/visual/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(visual): re-capture Linux baselines on CI Chromium"
            git push origin HEAD:${{ inputs.branch }}
          fi
