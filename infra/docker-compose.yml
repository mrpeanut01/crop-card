name: crop-card

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dev
    image: cropcard-web:dev
    ports:
      - "5173:5173"
    command: ["sh", "-c", "if [ ! -e /app/apps/web/node_modules/.modules.yaml ] && [ ! -e /app/node_modules/.modules.yaml ]; then pnpm install --frozen-lockfile; fi && pnpm --filter @cropcard/web dev"]
    volumes:
      - ..:/app
      - web-node-modules:/app/node_modules
      - web-app-node-modules:/app/apps/web/node_modules
      - web-data:/data
    # Azurite well-known dev credentials are sourced from infra/.env.dev
    # (gitignored). Run `cp infra/.env.dev.example infra/.env.dev` once.
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/data/cropcard.db
      AUTH_SECRET: dev-only-not-secret-change-in-prod
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:5173
      AZURE_BLOB_CONTAINER: cropcard-dev
      # Set in infra/.env.dev to enable Claude AI fallback for barcode lookup.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - azurite

  # Phase 23 — standalone plugin marketplace. Same image base, separate
  # SQLite DB (marketplace.db), separate Litestream replica path, ClamAV
  # sidecar for upload scanning (Sub-task E).
  marketplace:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dev
    image: cropcard-marketplace:dev
    ports:
      - "5174:5174"
    command: ["sh", "-c", "if [ ! -e /app/apps/marketplace/node_modules/.modules.yaml ] && [ ! -e /app/node_modules/.modules.yaml ]; then pnpm install --frozen-lockfile; fi && pnpm --filter @cropcard/marketplace db:migrate && pnpm --filter @cropcard/marketplace dev"]
    volumes:
      - ..:/app
      - marketplace-node-modules:/app/node_modules
      - marketplace-app-node-modules:/app/apps/marketplace/node_modules
      - marketplace-data:/data
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/data/marketplace.db
      AZURE_BLOB_CONTAINER: cropcard-marketplace-dev
      # Sub-task C reads these:
      MARKETPLACE_MODE: internet
      MARKETPLACE_ADMIN_EMAILS: ${MARKETPLACE_ADMIN_EMAILS:-srene@obsidiang.com}
      MARKETPLACE_SEED_CREDENTIAL: ${MARKETPLACE_SEED_CREDENTIAL:-}
      AUTH_SECRET: dev-only-not-secret-change-in-prod
      # Sub-task E talks to clamd over TCP — uniform across dev + prod.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      - azurite
      - clamav

  # Phase 23 / E — virus scanning sidecar. First boot pulls signatures
  # (~150MB, 10–15 min); subsequent boots reuse the persistent volume.
  clamav:
    image: clamav/clamav:1.3
    volumes:
      - clamav-signatures:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    environment:
      # Skip TLS lookups against the clamd Freshclam mirror in dev.
      CLAMAV_NO_FRESHCLAMD: "false"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      # Don't fail the marketplace boot while signatures are first downloading.
      start_period: 900s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  web-node-modules:
  web-app-node-modules:
  web-data:
  marketplace-node-modules:
  marketplace-app-node-modules:
  marketplace-data:
  clamav-signatures:
  azurite-data:
