# Minimal clamd config for the marketplace scan pipeline (Phase 23 / E).
#
# Used by infra/docker-compose.yml (clamav service) and the Azure
# Container App sidecar in infra/azure/main.bicep. The marketplace
# scan code talks to clamd over TCP — uniform across dev compose
# (CLAMAV_HOST=clamav) and prod ACA (CLAMAV_HOST=localhost via
# multi-container pod shared network namespace).
LogTime yes
LogVerbose no
LogClean no

# Network: TCP only. The default unix socket is fine for single-host
# layouts but mounting it cross-container in compose is fiddly; TCP is
# the simpler uniform choice for dev + prod.
TCPSocket 3310
TCPAddr 0.0.0.0

# Resource caps tuned for plugin JSON payloads — never bigger than
# 256 KB per Sub-task E size cap, so the defaults are wasteful.
MaxFileSize 1M
MaxScanSize 5M
MaxRecursion 8
MaxFiles 100

# Idle / connection management.
ReadTimeout 60
CommandReadTimeout 30
MaxThreads 10
MaxConnectionQueueLength 50
