<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory Unification — preview canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #15170F; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="./data.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel" src="./design-canvas.jsx"></script>
<script type="text/babel" src="./direction-almanac-today.jsx"></script>
<script type="text/babel" src="./direction-almanac-inventory.jsx"></script>

<script type="text/babel">
const A = window.A_tokens;

function useAlmanacBaseCss() {
  React.useEffect(() => {
    let style = document.getElementById("dir-styles");
    if (!style) {
      style = document.createElement("style");
      style.id = "dir-styles";
      document.head.appendChild(style);
    }
    style.textContent = window.A_baseCss || "";
  }, []);
}

function App() {
  useAlmanacBaseCss();
  return (
    <DesignCanvas
      title="Inventory unification — handoff preview"
      subtitle="One canonical pattern (List → Detail → Edit/Add) across 5 inventory types. Drag canvas to pan, ⌘/Ctrl-scroll to zoom, click any artboard to focus.">

      <DCSection id="taxonomy" title="00 · Taxonomy" subtitle="Read this first — the contract every screen below conforms to.">
        <DCArtboard id="inv-taxonomy" label="Inventory taxonomy + data matrix" width={1440} height={920}>
          <A_InventoryTaxonomy />
        </DCArtboard>
      </DCSection>

      <DCSection id="lists" title="01 · List screens" subtitle="Same chrome (type swap, KPI strip, search/filters, table). Columns and KPIs adapt to the selected type.">
        <DCArtboard id="list-pesticide" label="Pesticide list (Stock view · 12 SKUs)" width={1280} height={820}>
          <A_InventoryList type="pesticide" />
        </DCArtboard>
        <DCArtboard id="list-fertility" label="Fertility list (NPK columns)" width={1280} height={820}>
          <A_InventoryList type="fertility" />
        </DCArtboard>
        <DCArtboard id="list-seed" label="Seed & starts list" width={1280} height={820}>
          <A_InventoryList type="seed" />
        </DCArtboard>
        <DCArtboard id="list-crop" label="Crop plugin catalog list (137 loaded)" width={1280} height={820}>
          <A_InventoryList type="crop" />
        </DCArtboard>
        <DCArtboard id="list-sprayer" label="Sprayers list (calibration cycle)" width={1280} height={820}>
          <A_InventoryList type="sprayer" />
        </DCArtboard>
      </DCSection>

      <DCSection id="details" title="02 · Detail screens" subtitle="Canonical 2-column shell. Left = plugin-linked specs. Right = on-hand lots + usage history.">
        <DCArtboard id="detail-pesticide" label="Pesticide detail (safety kernel)" width={1280} height={900}>
          <A_InventoryDetail type="pesticide" />
        </DCArtboard>
        <DCArtboard id="detail-fertility" label="Fertility detail (NPK + nutrient plan)" width={1280} height={900}>
          <A_InventoryDetail type="fertility" />
        </DCArtboard>
        <DCArtboard id="detail-seed" label="Seed detail (germ + provenance + saving history)" width={1280} height={900}>
          <A_InventoryDetail type="seed" />
        </DCArtboard>
        <DCArtboard id="detail-crop" label="Crop plugin detail (catalog only — no lot panel)" width={1280} height={900}>
          <A_InventoryDetail type="crop" />
        </DCArtboard>
      </DCSection>

      <DCSection id="edit" title="03 · Edit / Add form" subtitle="Same component. Type selector at top controls which field stacks render. Right rail shows live save summary.">
        <DCArtboard id="edit-pesticide" label="Edit — Pesticide (kernel-locked plugin fields)" width={1280} height={900}>
          <A_InventoryEditForm type="pesticide" mode="edit" />
        </DCArtboard>
        <DCArtboard id="edit-fertility" label="Add — Fertility (NPK editor)" width={1280} height={900}>
          <A_InventoryEditForm type="fertility" mode="add" />
        </DCArtboard>
        <DCArtboard id="edit-seed" label="Add — Seed (germ, treatment, provenance)" width={1280} height={900}>
          <A_InventoryEditForm type="seed" mode="add" />
        </DCArtboard>
        <DCArtboard id="edit-crop" label="Edit — Crop plugin (archetype + varieties JSON)" width={1280} height={900}>
          <A_InventoryEditForm type="crop" mode="edit" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
