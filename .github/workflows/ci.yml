name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Phase 24 — fail PRs where the OpenAPI artifact has drifted from
      # the registry in apps/web/scripts/gen-openapi.mjs. Regenerate
      # locally with `pnpm --filter @cropcard/web gen:openapi` and commit.
      - name: OpenAPI artifact in sync with source
        run: |
          pnpm --filter @cropcard/web gen:openapi
          git diff --exit-code apps/web/static/openapi.json

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright browsers
        run: pnpm --filter @cropcard/web exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e

  # #101 — visual regression against the committed *-linux.png baselines.
  # Non-blocking until it has run green on the GitHub runner for a while:
  # the baselines were captured with a different chromium build than the
  # one `playwright install` pulls here. If it drifts, download the
  # `visual-diffs` artifact, inspect the *-actual.png files, and commit
  # them over the baselines once they look right.
  visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Install Playwright browsers
        run: pnpm --filter @cropcard/web exec playwright install --with-deps chromium

      - name: Visual regression
        env:
          E2E_VISUAL: "1"
        run: pnpm --filter @cropcard/web exec playwright test tests/e2e/visual --update-snapshots=none

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results/
          retention-days: 14

  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # az CLI is preinstalled on ubuntu-latest runners; install bicep into it.
      - name: Install Bicep
        run: az bicep install
      - name: Build Bicep
        run: az bicep build --file infra/azure/main.bicep
