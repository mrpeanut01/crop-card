name: deploy

# Deploys main to Azure Container Apps after `ci` passes on it.
#
# Auth is GitHub OIDC → the `cropcard-github-deploy` Entra app, federated to
# this repo's `production` environment (no Azure credentials in GitHub). App
# secrets stay in Key Vault; this workflow only lists their names to decide
# which optional features to switch on. One-time setup:
# scripts/setup-github-deploy.sh.
#
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, ACR_NAME, KEY_VAULT_NAME, and optionally EMAIL_FROM.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Single-writer SQLite: never let two deploys race a revision swap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.origin }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.ACR_NAME }}
      KV: ${{ vars.KEY_VAULT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Image tag
        id: meta
        run: |
          TAG="${SHA::7}"
          echo "image=${ACR}.azurecr.io/cropcard-web:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Registry login
        run: az acr login --name "$ACR"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Optional secrets present in Key Vault
        id: secrets
        run: |
          NAMES="$(az keyvault secret list --vault-name "$KV" --query "[].name" -o tsv)"
          has() { printf '%s\n' "$NAMES" | grep -qx "$1" && echo true || echo false; }
          printf '%s\n' "$NAMES" | grep -qx auth-secret || { echo "::error::auth-secret missing from $KV"; exit 1; }
          echo "postmark=$(has postmark-token)" >> "$GITHUB_OUTPUT"
          echo "anthropic=$(has anthropic-api-key)" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        id: deploy
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          EXTRA=()
          [ -n "$EMAIL_FROM" ] && EXTRA+=(--parameters emailFrom="$EMAIL_FROM")
          az deployment group create -g "$RG" --name main \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters.dev.bicepparam \
            --parameters image="${{ steps.meta.outputs.image }}" \
                         containerRegistryServer="${ACR}.azurecr.io" \
                         keyVaultName="$KV" \
                         hasPostmarkToken="${{ steps.secrets.outputs.postmark }}" \
                         hasAnthropicKey="${{ steps.secrets.outputs.anthropic }}" \
            "${EXTRA[@]}" --output none
          ORIGIN="$(az deployment group show -g "$RG" --name main --query properties.outputs.appOrigin.value -o tsv)"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          ORIGIN="${{ steps.deploy.outputs.origin }}"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "${ORIGIN}/api/health"; then echo; echo "Health OK"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep 10
          done
          echo "::error::health check failed for ${ORIGIN}"
          exit 1
