name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright browsers
        run: pnpm --filter @cropcard/web exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e

  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # az CLI is preinstalled on ubuntu-latest runners; install bicep into it.
      - name: Install Bicep
        run: az bicep install
      - name: Build Bicep
        run: az bicep build --file infra/azure/main.bicep
