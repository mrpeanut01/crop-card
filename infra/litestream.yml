# Litestream replication config.
#
# AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_KEY, AZURE_BLOB_CONTAINER are injected
# from Azure Container Apps env vars (or Key Vault secret refs).
# In production we prefer managed-identity, but Litestream's Azure backend
# uses account+key, so we plumb a Key Vault secret for the account key.

# Prometheus metrics, loopback only. The app reads the replica position here
# during a deploy handoff to prove its last WAL frame reached Blob before it
# releases the database (apps/web/src/lib/server/ops/handoff.ts).
addr: "127.0.0.1:9090"

dbs:
  - path: /data/cropcard.db
    replicas:
      - type: abs
        account-name: ${AZURE_STORAGE_ACCOUNT}
        account-key: ${AZURE_STORAGE_KEY}
        bucket: ${AZURE_BLOB_CONTAINER}
        path: cropcard.db
        # 24 hours of point-in-time restore. Every cold start begins a new
        # generation, and each restore lists every generation it keeps, so a
        # 7-day window (about 420 generations at 60 starts a day) cost about
        # $65 a month in ListBlobs calls. Older points are still recoverable
        # from the 30-day blob versions (docs/ops/restore-runbook.md).
        retention: 24h
        # Hourly snapshots: the app scales to zero, so every cold start is a
        # restore, and restore time grows with the WAL since the last snapshot.
        snapshot-interval: 1h
        sync-interval: 1s

  # Phase 23 — marketplace catalog. Same Azure storage account, separate
  # bucket (AZURE_BLOB_CONTAINER differs per app — see infra/azure/main.bicep
  # and infra/docker-compose.yml). Litestream sees both dbs and the
  # entrypoint only restores / replicates the one matching DB_PATH.
  - path: /data/marketplace.db
    replicas:
      - type: abs
        account-name: ${AZURE_STORAGE_ACCOUNT}
        account-key: ${AZURE_STORAGE_KEY}
        bucket: ${AZURE_BLOB_CONTAINER}
        path: marketplace.db
        retention: 24h
        snapshot-interval: 1h
        sync-interval: 1s
