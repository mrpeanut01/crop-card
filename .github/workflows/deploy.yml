name: deploy

# Deploys main to Azure Container Apps after `ci` passes on it, and succeeds
# only when the live app's /api/health reports the deployed SHA.
# scripts/watch-deploy.sh follows a merge through to that point.
#
# Auth is GitHub OIDC → the `cropcard-github-deploy` Entra app, federated to
# this repo's `production` environment (no Azure credentials in GitHub). App
# secrets stay in Key Vault; this workflow only lists their names to decide
# which optional features to switch on. One-time setup:
# scripts/setup-github-deploy.sh.
#
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, ACR_NAME, KEY_VAULT_NAME, and optionally EMAIL_FROM.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Single-writer SQLite: never let two deploys race a revision swap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.origin }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.ACR_NAME }}
      KV: ${{ vars.KEY_VAULT_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Image tag
        id: meta
        run: |
          TAG="${SHA::7}"
          echo "image=${ACR}.azurecr.io/cropcard-web:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Registry login
        run: az acr login --name "$ACR"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: BUILD_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One deploy path: the same script a human runs, in --ci mode (no
      # creates or grants, secret names only). It deploys infra/azure/main.bicep
      # with the image above and returns only once /api/health reports this SHA.
      - name: Deploy and wait until live
        id: deploy
        env:
          CROPCARD_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CROPCARD_ACR: ${{ vars.ACR_NAME }}
          CROPCARD_KV: ${{ vars.KEY_VAULT_NAME }}
          CROPCARD_SHA: ${{ env.SHA }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: ./scripts/deploy-azure.sh --apply --ci --image "${{ steps.meta.outputs.image }}"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Live: \`${SHA::7}\`"
            echo
            echo "${{ steps.deploy.outputs.origin }} is serving ${SHA} (checked via /api/health)."
          } >> "$GITHUB_STEP_SUMMARY"
